# Firebase App Hosting Configuration
# All environment variables are injected at build and runtime

runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

env:
  # Database Configuration
  - variable: DATABASE_HOST
    value: 34.63.62.50
  - variable: DATABASE_PORT
    value: "3306"
  - variable: DATABASE_USERNAME
    value: kika-admin
  - variable: DATABASE_PASSWORD
    secret: DATABASE_PASSWORD
  - variable: DATABASE_NAME
    value: kikadb
  - variable: DATABASE_SSL
    value: "true"
  - variable: DATABASE_SYNCHRONIZE
    value: "false"
  - variable: DATABASE_LOGGING
    value: "true"

  # Application Settings
  - variable: NODE_ENV
    value: production
  - variable: APP_NAME
    value: KIKA Platform
  - variable: APP_URL
    value: https://kika-bw.web.app

  # Email Configuration
  - variable: EMAIL_HOST
    value: smtp.example.com
  - variable: EMAIL_PORT
    value: "587"
  - variable: EMAIL_USER
    value: ""
  - variable: EMAIL_PASSWORD
    secret: EMAIL_PASSWORD
  - variable: EMAIL_FROM
    value: noreply@kika.bw

  # File Upload Configuration
  - variable: MAX_FILE_SIZE
    value: "10485760"
  - variable: UPLOAD_DIR
    value: ./uploads

  # Session Configuration
  - variable: SESSION_MAX_AGE
    value: "86400"

  # MFA Configuration
  - variable: MFA_ISSUER
    value: KIKA Platform
  - variable: MFA_WINDOW
    value: "1"

  # Logging
  - variable: LOG_LEVEL
    value: info

  # Firebase Admin SDK Credentials
  - variable: FIREBASE_ADMIN_CREDENTIALS
    secret: FIREBASE_ADMIN_CREDENTIALS

  # Firebase Client-Side Configuration (public)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDEbq-e54hhgHrhIB6qVX8t8QlCysGPAIw
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: kika-bw.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: kika-bw
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: kika-bw.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1054148523063"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1054148523063:web:5f51c5a21268f47db7fbb2"
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-03TBRC18WQ

  # SMS Portal Configuration
  - variable: SMS_PORTAL_CLIENT_ID
    secret: SMS_PORTAL_CLIENT_ID
  - variable: SMS_PORTAL_API_SECRET
    secret: SMS_PORTAL_API_SECRET
  - variable: SMS_PORTAL_API_URL
    value: https://rest.smsportal.com/v1

  # Brevo SMTP Configuration (Email Service)
  - variable: SMTP_HOST
    value: smtp-relay.brevo.com
  - variable: SMTP_PORT
    value: "587"
  - variable: SMTP_USER
    value: a21b4b001@smtp-brevo.com
  - variable: SMTP_PASS
    secret: SMTP_PASS
  - variable: SMTP_FROM
    value: admin@dl-africa.com
