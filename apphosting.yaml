  - variable: EMAIL_FROM
    value: noreply@kika.bw

  # File Upload Configuration
  - variable: MAX_FILE_SIZE
    value: "10485760"
  - variable: UPLOAD_DIR
    value: ./uploads

  # Session Configuration
  - variable: SESSION_MAX_AGE
    value: "86400"

  # MFA Configuration
  - variable: MFA_ISSUER
    value: KIKA Platform
  - variable: MFA_WINDOW
    value: "1"

