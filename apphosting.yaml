# Firebase App Hosting Configuration
# All environment variables are injected at build and runtime

runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

env:
  # Database Configuration
  - variable: DATABASE_HOST
    value: 34.63.62.50
  - variable: DATABASE_PORT
    value: "3306"
  - variable: DATABASE_USERNAME
    value: kika-admin
  - variable: DATABASE_PASSWORD
    value: Kika@2026
  - variable: DATABASE_NAME
    value: kikadb
  - variable: DATABASE_SSL
    value: "true"
  - variable: DATABASE_SYNCHRONIZE
    value: "false"
  - variable: DATABASE_LOGGING
    value: "true"

  # Application Settings
  - variable: NODE_ENV
    value: production
  - variable: APP_NAME
    value: KIKA Platform
  - variable: APP_URL
    value: https://kika--kika-bw.us-central1.hosted.app

  # Email Configuration
  - variable: EMAIL_HOST
    value: smtp.example.com
  - variable: EMAIL_PORT
