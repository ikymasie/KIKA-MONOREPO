# Firebase App Hosting Configuration
# All environment variables are injected at build and runtime

runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

env:
  # Database Configuration
  - variable: DATABASE_HOST
    value: 34.63.62.50
  - variable: DATABASE_PORT
    value: "3306"
  - variable: DATABASE_USERNAME
    value: kika-admin
  - variable: DATABASE_PASSWORD
    value: Kika@2026
  - variable: DATABASE_NAME
    value: kikadb
  - variable: DATABASE_SSL
    value: "true"
  - variable: DATABASE_SYNCHRONIZE
    value: "false"
  - variable: DATABASE_LOGGING
    value: "true"

  # Application Settings
  - variable: NODE_ENV
    value: production
  - variable: APP_NAME
    value: KIKA Platform
  - variable: APP_URL
    value: https://kika--kika-bw.us-central1.hosted.app

  # Email Configuration
  - variable: EMAIL_HOST
    value: smtp.example.com
  - variable: EMAIL_PORT
    value: "587"
  - variable: EMAIL_USER
    value: ""
  - variable: EMAIL_PASSWORD
    value: ""
  - variable: EMAIL_FROM
    value: noreply@kika.bw

  # File Upload Configuration
  - variable: MAX_FILE_SIZE
    value: "10485760"
  - variable: UPLOAD_DIR
    value: ./uploads

  # Session Configuration
  - variable: SESSION_MAX_AGE
    value: "86400"

  # MFA Configuration
  - variable: MFA_ISSUER
    value: KIKA Platform
  - variable: MFA_WINDOW
    value: "1"

  # Logging
  - variable: LOG_LEVEL
    value: info

